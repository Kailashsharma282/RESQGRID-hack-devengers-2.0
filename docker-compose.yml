version: '3.8'

services:
  # ==========================================
  # 1. RESQGRID API (BACKEND GATEWAY)
  # ==========================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: resqgrid-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - CORS_ORIGIN=*
      - DATABASE_URL=postgresql://resq_admin:resq_secret2026@postgres:5432/resqgrid?schema=public
      - JWT_SECRET=resqgrid_hackathon_super_secret_jwt_key_2026
      - STORAGE_PROVIDER=s3
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_S3_BUCKET_NAME=resqgrid-emergency-media
      - AWS_S3_ENDPOINT=http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - resqgrid-network

  # ==========================================
  # 2. RESQGRID WEB (FRONTEND COMMAND CENTER)
  # ==========================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: resqgrid-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - api
    networks:
      - resqgrid-network

  # ==========================================
  # 3. POSTGRESQL (NEON-COMPATIBLE ENGINE)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: resqgrid-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=resq_admin
      - POSTGRES_PASSWORD=resq_secret2026
      - POSTGRES_DB=resqgrid
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resq_admin -d resqgrid"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - resqgrid-network

  # ==========================================
  # 4. REDIS (EVENT BROKER & DISTRIBUTED CACHE)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: resqgrid-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - resqgrid-network

  # ==========================================
  # 5. MINIO (AWS S3 COMPATIBLE STORAGE)
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: resqgrid-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - resqgrid-network

networks:
  resqgrid-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
